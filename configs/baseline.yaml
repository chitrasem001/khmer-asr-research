# M0 — pretrained models, no fine-tuning, on the locked test set.
experiment:
  name: m0_baseline
  seed: 42
  output_dir: experiments/m0_baseline

models:
  - name_or_path: openai/whisper-small
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
    family: whisper
    language: km
    batch_size: 16
  - name_or_path: openai/whisper-medium
    revision: abdf7c39ab9d0397620ccaea8974cc764cd0953e
    family: whisper
    language: km
    batch_size: 8
  - name_or_path: openai/whisper-large-v3-turbo
    revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
    family: whisper
    language: km
    batch_size: 8
  - name_or_path: facebook/mms-1b-all          # CC BY-NC 4.0: research use only
    revision: 3d33597edbdaaba14a8e858e2c8caa76e3cec0cd
    family: mms
    language: khm
    batch_size: 8

data:
  dataset: Digital-Divide-Data/khmer-speech-dataset
  revision: e872b0c58b4bbbe30c0244def61e39e7b57ea093
  test_manifest: data/manifests/test.csv
  audio_dir: data/processed/audio
  sampling_rate: 16000

inference:
  fp16: true
  decoding: greedy
