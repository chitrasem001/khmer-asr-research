# Khmer ASR Studio demo app (app/server.py). Thesis numbers come from the locked test set,
# not from this demo; the Results tab only displays experiments/*/metrics.json.
models:
  - id: mms-zero-shot
    label: MMS-1B · zero-shot
    color: "#2B44B8"
    family: mms
    name_or_path: facebook/mms-1b-all
    revision: 3d33597edbdaaba14a8e858e2c8caa76e3cec0cd
    language: khm
  - id: whisper-small-zero-shot
    label: Whisper small · zero-shot
    color: "#E8590C"
    family: whisper
    name_or_path: openai/whisper-small
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
    language: km
    max_new_tokens: 200   # zero-shot Whisper loops; capped so the demo stays responsive
  # Fine-tuned weights are git-ignored; download them from the private HF repo
  # chitra168/khmer-asr-thesis-models (folder s_whisper_small_100h/best) into experiments/.
  - id: whisper-small-100h
    label: Whisper small · fine-tuned 100 h
    color: "#8F3A0A"
    family: whisper
    name_or_path: experiments/s_whisper_small_100h/best
    revision: null
    language: km

samples:
  manifest: data/manifests/test.csv
  audio_dir: data/processed/audio
  per_speaker: 6
  min_duration_s: 4
  max_duration_s: 12
  seed: 42

results:
  - stage: zero-shot
    test_runs: experiments/m0_baseline
    fleurs_runs: experiments/m0_fleurs
  - stage: fine-tuned
    test_runs: experiments/m1_eval
    fleurs_runs: experiments/m1_eval_fleurs
    names:  # run folder -> label
      m1_whisper_small: whisper-small 10 h
      s_whisper_small_50h: whisper-small 50 h
      s_whisper_small_100h: whisper-small 100 h
      m1_mms: mms-1b 10 h
      s_mms_50h: mms-1b 50 h
      s_mms_100h: mms-1b 100 h
