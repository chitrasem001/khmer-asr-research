# M1/M2 — Khmer fine-tuning. Change one major variable at a time.
experiment:
  name: m1_finetune
  seed: 42
  output_dir: experiments/m1_finetune

model:
  name_or_path: openai/whisper-small
  revision: null
  language: khmer
  task: transcribe
  freeze_encoder: false

data:
  dataset: Digital-Divide-Data/khmer-speech-dataset
  revision: e872b0c58b4bbbe30c0244def61e39e7b57ea093
  train_manifest: data/manifests/train.parquet
  validation_manifest: data/manifests/validation.csv
  test_manifest: data/manifests/test.csv   # locked; never used for model selection
  test_seen_speakers_manifest: data/manifests/test_seen_speakers.csv
  sampling_rate: 16000
  max_duration_s: 30.0
  min_duration_s: 0.5
  train_hours: null                        # e.g. 10 / 50 / 100 for scaling experiments

preprocessing:
  normalize_text: true
  augmentation: none                       # M2 candidate: speed_perturb, noise, specaugment

training:
  learning_rate: 1.0e-5
  warmup_steps: 500
  max_steps: 5000
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  fp16: true
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  metric_for_best_model: cer
  greater_is_better: false
